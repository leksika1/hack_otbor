services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: agent-session-analyzer-backend
    container_name: analyzer-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    image: agent-session-analyzer-frontend
    container_name: analyzer-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
